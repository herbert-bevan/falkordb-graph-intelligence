[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-intelligence"
version = "0.1.0"
description = "FalkorDB Graph Intelligence Platform with 3 MCP Servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2",
    "falkordb>=1.8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
